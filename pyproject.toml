[project]
name = "projeto-velocidade"
version = "0.1.0"
description = ""
authors = [
    {name = "Vitor Fantini",email = "vitormf3003@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.14.1 || >3.14.1,<4.0"
dependencies = [
    "torch (>=2.12.0,<3.0.0)",
    "torchvision (>=0.27.0,<0.28.0)",
    "torchaudio (>=2.11.0,<3.0.0)",
    "ultralytics (>=8.4.51,<9.0.0)",
    "numpy (>=2.4.4,<3.0.0)",
    "opencv-python (>=4.13.0.92,<5.0.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "yt-dlp (>=2026.3.17,<2027.0.0)",
    "pytubefix (>=10.7.1,<11.0.0)"
]

[tool.poetry]
packages = [{include = "projeto_velocidade", from = "src"}]

[[tool.poetry.source]]
name = "pytorch_cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"


[tool.poetry.dependencies]
torch = {source = "pytorch_cpu"}
torchvision = {source = "pytorch_cpu"}
torchaudio = {source = "pytorch_cpu"}
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
